{% extends "base.html" %}

{% block title %}Edit Task – {{ app_name }}{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 0 auto;">
  <div style="margin-bottom: 1.5rem;">
    <a href="/tasks">&larr; Back to tasks</a>
    <h1 style="margin-top: 0.5rem;">Edit Task</h1>
  </div>

  <div class="card">
    {% if error %}
    <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/tasks/{{ task.id }}/update">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="form-group">
        <label for="edit-title">Title *</label>
        <input
          type="text"
          id="edit-title"
          name="title"
          class="form-control"
          value="{{ task.title }}"
          required
        >
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="edit-subject">Subject</label>
          <input
            type="text"
            id="edit-subject"
            name="subject"
            class="form-control"
            value="{{ task.subject or '' }}"
          >
        </div>
        <div class="form-group">
          <label for="edit-kind">Kind</label>
          <select id="edit-kind" name="kind" class="form-control">
            <option value="assignment" {% if task.kind == 'assignment' %}selected{% endif %}>Assignment</option>
            <option value="exam" {% if task.kind == 'exam' %}selected{% endif %}>Exam</option>
            <option value="submission" {% if task.kind == 'submission' %}selected{% endif %}>Submission</option>
            <option value="other" {% if task.kind == 'other' %}selected{% endif %}>Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="edit-deadline">Deadline</label>
          <input
            type="date"
            id="edit-deadline"
            name="deadline"
            class="form-control"
            value="{% if task.deadline %}{{ task.deadline.isoformat() }}{% endif %}"
          >
        </div>
        <div class="form-group">
          <label for="edit-est-hours">Estimated Hours</label>
          <input
            type="number"
            step="0.5"
            min="0"
            id="edit-est-hours"
            name="estimated_hours"
            class="form-control"
            value="{% if task.estimated_hours is not none %}{{ task.estimated_hours }}{% endif %}"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="edit-description">Description / Notes</label>
        <textarea
          id="edit-description"
          name="description"
          class="form-control"
        >{{ task.description or '' }}</textarea>
      </div>

      <div style="display: flex; gap: 0.75rem; align-items: center; margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary" id="save-task-btn">Save Changes</button>
        <a href="/tasks" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
