{% extends "base.html" %}

{% block page_title %}Delete Data{% endblock %}

{% block page_content %}
<div class="max-w-lg w-full space-y-6">
  <div class="sr-card p-8 text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-rose-100 text-rose-600 mb-6 dark:bg-rose-900/20 dark:text-rose-400">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
    </div>
    <h2 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Delete All Data</h2>
    <p class="text-gray-600 dark:text-gray-400 mb-6">This permanently deletes all your tasks, imports, messages, candidates, and settings. This action cannot be undone.</p>

    {% if message %}
    <div class="bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-lg text-sm dark:bg-emerald-900/20 dark:border-emerald-800 dark:text-emerald-100 mb-6" role="alert">
      {{ message }}
    </div>
    {% endif %}

    <form method="post" class="space-y-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="sr-btn sr-btn-danger w-full py-3 text-sm font-semibold flex items-center justify-center gap-2" onclick="return confirm('Are you sure? This cannot be undone.')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
        Yes, delete all my data
      </button>
    </form>
  </div>
</div>
{% endblock %}
