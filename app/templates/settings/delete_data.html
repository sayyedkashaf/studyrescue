{% extends "base.html" %}

{% block page_title %}Delete Data{% endblock %}

{% block page_content %}
<div class="max-w-lg w-full mx-auto my-8 space-y-6">
  <div class="sr-card bg-[#111827] border border-[#1f2937] p-8 rounded-2xl shadow-2xl text-center">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-red-500/10 border border-red-500/20 text-[#f87171] mb-5">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
    </div>
    <h2 class="text-2xl font-bold text-[#f87171] mb-2">Delete All Data</h2>
    <p class="text-[#9ca3af] text-sm mb-6">This permanently deletes all your tasks, imports, messages, candidates, and settings. This action cannot be undone.</p>

    {% if message %}
    <div class="bg-emerald-500/10 border border-emerald-500/25 text-[#34d399] px-4 py-3 rounded-xl text-sm mb-6" role="alert">
      {{ message }}
    </div>
    {% endif %}

    <form method="post" class="space-y-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="sr-btn sr-btn-danger w-full py-3 text-sm font-semibold rounded-xl flex items-center justify-center gap-2" onclick="return confirm('Are you sure? This cannot be undone.')">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
        Yes, delete all my data
      </button>
      <a href="/settings" class="sr-btn sr-btn-secondary w-full py-3 text-sm font-semibold rounded-xl block text-center">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
